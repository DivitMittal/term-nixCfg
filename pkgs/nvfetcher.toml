[zellij-harpoon]
src.github_tag = "Nacho114/harpoon"
fetch.url = "https://github.com/Nacho114/harpoon/releases/download/$ver/harpoon.wasm"

[zellij-vertical-tabs]
src.github_tag = "cfal/zellij-vertical-tabs"
fetch.url = "https://github.com/cfal/zellij-vertical-tabs/releases/download/$ver/zellij-vertical-tabs.wasm"

# No tagged releases; tracks master HEAD. Vendored tmux plugin via
# `pkgs.tmuxPlugins.mkTmuxPlugin` in config/home/multiplexers/tmux.nix.
# Pin with `src.manual = "<sha>"` if reproducibility matters more than freshness.
[tmux-fzf]
src.git = "https://github.com/sainnhe/tmux-fzf"
fetch.github = "sainnhe/tmux-fzf"

# No tagged releases; tracks master HEAD. herdr plugin installed declaratively
# via xdg.dataFile + a herdr-plugin-link activation hook in
# config/home/multiplexers/herdr.nix.
[herdr-remote]
src.git = "https://github.com/dcolinmorgan/herdr-remote"
fetch.github = "dcolinmorgan/herdr-remote"

# No tagged releases; tracks master HEAD. herdr plugin installed declaratively
# via xdg.dataFile + a herdr-plugin-link activation hook in
# config/home/multiplexers/herdr.nix. Companion Neovim plugin
# (lmilojevicc/herdr-splits.nvim) is wired in
# ../Vim-Cfg/lua/plugins/misc.lua with arrow-key nav/resize overrides
# (matches the rest of the stack).
[herdr-splits]
src.git = "https://github.com/lmilojevicc/herdr-splits.nvim"
fetch.github = "lmilojevicc/herdr-splits.nvim"

# herdr — prebuilt release binaries (raw executables, no archive), one entry
# per platform. nixpkgs lags far behind upstream and builds from source; the
# plugin system used in config/home/tty/multiplexers/herdr.nix needs a recent
# release. Assets are named herdr-<os>-<arch>.
[herdr-x86_64-darwin]
src.github = "ogulcancelik/herdr"
fetch.url = "https://github.com/ogulcancelik/herdr/releases/download/$ver/herdr-macos-x86_64"

[herdr-aarch64-darwin]
src.github = "ogulcancelik/herdr"
fetch.url = "https://github.com/ogulcancelik/herdr/releases/download/$ver/herdr-macos-aarch64"

[herdr-x86_64-linux]
src.github = "ogulcancelik/herdr"
fetch.url = "https://github.com/ogulcancelik/herdr/releases/download/$ver/herdr-linux-x86_64"

[herdr-aarch64-linux]
src.github = "ogulcancelik/herdr"
fetch.url = "https://github.com/ogulcancelik/herdr/releases/download/$ver/herdr-linux-aarch64"
